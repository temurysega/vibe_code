# Blueprint для Render: New → Blueprint → выбрать этот репозиторий.
# Бесплатный тариф засыпает без посетителей; при пробуждении демо-данные создаются заново.
services:
  - type: web
    name: mgimo-mania
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/demo/accounts
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_FILE
        value: data/mgimo.db
      # Ключ ИИ-помощника задаётся в панели Render и в репозиторий не попадает
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
